[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m5phet"
version = "0.1.0"
description = "Typed machine-learning interfaces for decisions, forecasting and policies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
web-test = ["httpx>=0.27,<1", "pytest>=8", "playwright>=1.50,<2"]

[project.scripts]
m5phet-chat = "m5phet.web.app:main"

[tool.setuptools.package-data]
"m5phet" = ["config.schema.json"]
"m5phet.web" = ["static/*", "static/vendor/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
