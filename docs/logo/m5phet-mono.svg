    <line x1="125.29" y1="111.24" x2="133.52" y2="122.57"/><circle cx="133.52" cy="122.57" r="2.6" class="dot"/>
    <line x1="114.71" y1="111.24" x2="106.48" y2="122.57"/><circle cx="106.48" cy="122.57" r="2.6" class="dot"/>
    <line x1="111.44" y1="101.18" x2="98.13" y2="96.85"/><circle cx="98.13" cy="96.85" r="2.6" class="dot"/>
