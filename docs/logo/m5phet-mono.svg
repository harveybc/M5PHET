    <path d="M 0,-9 C 13,-13 24,-30 15,-43 C 9,-51 -9,-51 -15,-43 C -24,-30 -13,-13 0,-9 Z" transform="translate(120.00 103.96) rotate(144)"/>
    <path d="M 0,-9 C 13,-13 24,-30 15,-43 C 9,-51 -9,-51 -15,-43 C -24,-30 -13,-13 0,-9 Z" transform="translate(120.00 103.96) rotate(216)"/>
    <path d="M 0,-9 C 13,-13 24,-30 15,-43 C 9,-51 -9,-51 -15,-43 C -24,-30 -13,-13 0,-9 Z" transform="translate(120.00 103.96) rotate(288)"/>
  </g>
  <g class="l" stroke-width="3">
        <line x1="120.00" y1="94.96" x2="120.00" y2="80.96"/><circle cx="120.00" cy="80.96" r="2.6" class="dot"/>
