<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d">
  <title id="t">M5PHET</title>
  <desc id="d">Line art: a downward triangle with rounded corners (the triad: decentralization, self-awareness, evolution) enclosing a circle (the link between everything) that holds a five-petal flower seen from above (the five machine-learning disciplines), with one stamen per petal.</desc>
  <style>.l{fill:none;stroke:#111111;stroke-linejoin:round;stroke-linecap:round}.dot{fill:#111111;stroke:none}</style>
  <!-- the triad: one stroke, rounded corners -->
  <polygon class="l" points="30,52 210,52 120,207.9" stroke-width="7"/>
  <!-- the circle that links everything: the incircle of the triad -->
  <circle class="l" cx="120.00" cy="103.96" r="51.96" stroke-width="4.5"/>
  <!-- the five disciplines: five petals from above, no stem, no leaves; one stamen each -->
  <g class="l" stroke-width="4">
        <path d="M 0,-9 C 13,-13 24,-30 15,-43 C 9,-51 -9,-51 -15,-43 C -24,-30 -13,-13 0,-9 Z" transform="translate(120.00 103.96) rotate(0)"/>
